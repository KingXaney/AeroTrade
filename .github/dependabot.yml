version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  # The browser QA tooling (playwright, mongodb-memory-server, jiti), installed apart from the app.
  - package-ecosystem: npm
    directory: /scripts/qa
    schedule:
      interval: monthly
    groups:
      qa-tooling:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
